service: emp-server
configValidationMode: off
useDotenv: false

custom:
  id: ${aws:accountId, '654654346518'}
  domain: emp-server.com
  stage: ${opt:stage, self:provider.stage}

provider:
  name: aws
  runtime: nodejs20.x  
  region: us-east-1 
  memorySize: 512
  timeout: 30
  apiGateway:
    binaryMediaTypes:
      - "multipart/form-data"
  tags:
    service: emp-service
    company: emp-server
    project: emp-server
  tracing:
    apiGateway: false
    lambda: false
  logs:
    restApi:
      level: ERROR
  iam:
    role: arn:aws:iam::${self:custom.id}:role/serverless-lambda

plugins:
  - serverless-offline
  - serverless-prune-plugin


package:
  exclude:
    - "node_modules/aws-sdk/**"
    - "node_modules/typescript/**"

functions:
  app:
    handler: src/aws/lambda-handler.handler
    timeout: 300
    events:
      - http:
          path: /api/
          method: ANY
          cors: true
      - http:
          path: /api/{proxy+}
          method: ANY
          cors: true